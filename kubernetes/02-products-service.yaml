apiVersion: apps/v1
kind: Deployment
metadata:
  name: products-service
  namespace: microapp
  labels:
    app: products-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: products-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: products-service
    spec:
      restartPolicy: Always
      containers:
        - name: products-service
          image: acrmp2grupo10.azurecr.io/products-service:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3002
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: products-svc
  namespace: microapp
  labels:
    app: products-service
spec:
  type: ClusterIP
  selector:
    app: products-service
  ports:
    - port: 3002
      targetPort: 3002
      name: http
